services:
  db:
    image: postgres:16-alpine
    container_name: newity-db
    environment:
      POSTGRES_USER: newity
      POSTGRES_PASSWORD: newity
      POSTGRES_DB: newity
    ports:
      # 5433 on the host so we don't collide with a locally installed Postgres
      - "5433:5432"
    volumes:
      - newity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newity -d newity"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  newity-db-data:
